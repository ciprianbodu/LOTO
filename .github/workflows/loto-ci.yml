name: LOTO CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Python 3.15 checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LOTO_UI_PORT: "8765"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements_base.txt
      - name: Isolate test runtime
        run: |
          command -v pwsh
          printf 'LOTO_RUNTIME_DIR=%s/loto-runtime\nLOTO_WF_CACHE_DIR=%s/loto-wf-cache\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements_base.txt
          python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run full regression suite
        run: python -m pytest -q -p no:cacheprovider --durations=15
      - name: Check NiceGUI startup over HTTP
        shell: bash
        run: |
          log="$RUNNER_TEMP/loto-smoke.log"
          python app_nicegui.py >"$log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            kill -0 "$pid" 2>/dev/null || break
            if curl --fail --silent --max-time 2 "http://127.0.0.1:$LOTO_UI_PORT/" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$log"
          exit 1
      - name: Audit dependency vulnerabilities
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements_base.txt --progress-spinner off

  windows-launchers:
    name: Windows launchers on Python 3.15
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements_base.txt
      - name: Isolate test runtime
        shell: pwsh
        run: |
          "LOTO_RUNTIME_DIR=$env:RUNNER_TEMP/loto-runtime" >> $env:GITHUB_ENV
          "LOTO_WF_CACHE_DIR=$env:RUNNER_TEMP/loto-wf-cache" >> $env:GITHUB_ENV
      - name: Install dependencies
        run: |
          python -m pip install -r requirements_base.txt
          python -m pip check
      # The offline-pin test requires an NTFS checkout for its Git fixtures.
      - name: Run Windows launcher and process tests
        run: >-
          python -m pytest -q -p no:cacheprovider --durations=15
          --basetemp="$env:LOCALAPPDATA/Temp/loto-launchers-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          test_launcher_git.py test_launcher_ensure_git.py
          test_bat_windows_cmd.py test_bench_windows_launch_2026_11_02.py
          test_cleanup_old_processes.py
